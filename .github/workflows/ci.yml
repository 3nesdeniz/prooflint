name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=prooflint --cov-report=term-missing --cov-fail-under=95
      - name: Build distributions
        run: uv build --no-build-isolation --clear
      - name: Validate distributions
        run: |
          uv run twine check dist/*
          uv run check-wheel-contents dist/*.whl
      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project \
            --with ./dist/prooflint-0.1.0-py3-none-any.whl \
            prooflint --version
